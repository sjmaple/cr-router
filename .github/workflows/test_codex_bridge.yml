name: Codex bridge prototype

on:
  pull_request:
    paths:
      - install/codex-bridge/**
      - .github/workflows/test_codex_bridge.yml
  push:
    branches: [main]
    paths:
      - install/codex-bridge/**
      - .github/workflows/test_codex_bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install aiohttp==3.14.1
      - run: python -m unittest discover -s install/codex-bridge -p 'test_*.py'
